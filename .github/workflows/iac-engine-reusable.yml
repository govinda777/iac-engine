name: Centralized IaC Engine Reusable Core

on:
  workflow_call:
    inputs:
      environment:
        description: "The target execution environment (e.g., dev, staging, prod)"
        required: true
        type: string
      aws_region:
        description: "The AWS target region for infrastructure provisioning"
        required: false
        type: string
        default: "us-east-1"
      iam_role_arn:
        description: "The specific AWS IAM OIDC Role ARN to assume for this Spoke"
        required: true
        type: string
      working_directory:
        description: "The working directory for the infrastructure code"
        required: false
        type: string
        default: "."
      framework:
        description: "The framework to use (e.g. tofu, terraform)"
        required: false
        type: string
        default: "tofu"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  iac-pipeline:
    name: Ephemeral IaC Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Spoke Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC Keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.iam_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          audience: sts.amazonaws.com

      - name: Setup OpenTofu / Terraform
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.8"

      - name: Validate Security Requirements
        run: python3 scripts/lint_security.py ${{ inputs.working_directory }}

      - name: Decentralized Backend Initialization
        working-directory: ${{ inputs.working_directory }}
        run: |
          echo "Initializing decentralized backend..."
          ${{ inputs.framework }} init

      - name: Validate IaC Configurations
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.framework }} validate

      - name: Execute Plan Preview (Pull Request)
        id: plan
        if: github.event_name == 'pull_request'
        working-directory: ${{ inputs.working_directory }}
        run: |
          ${{ inputs.framework }} plan -no-color -out=tfplan > plan_output.log
          cat plan_output.log

      - name: Execute Apply Deploy (Merge / Push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.framework }} apply -auto-approve
